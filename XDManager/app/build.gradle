plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xd.xdmanager'
    compileSdk 32

    defaultConfig {
        applicationId "com.xd.xdmanager"
        minSdk 24
        targetSdk 32
        versionCode 3
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.MD'
        exclude 'META-INF/io.netty.versions.properties'
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFile
            def targetFileNamePrefix
            def formattedData = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone("GMT+08"))
            def fileNamePrefix = "${project.name}-${variant.baseName}"
            project.logger.error("fileNamePrefix: ${fileNamePrefix}")

            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                project.logger.error("outputFile: ${outputFile}")

                if (variant.buildType.name == "release") {
                    targetFileNamePrefix = "XDManager_V${project.android.defaultConfig.versionCode}_${project.android.defaultConfig.versionName}_${variant.productFlavors.name}_release_${formattedData}"
                } else if (variant.buildType.name == "debug") {
                    targetFileNamePrefix = "XDManager_V${project.android.defaultConfig.versionCode}_${project.android.defaultConfig.versionName}_${variant.productFlavors.name}_debug_${formattedData}"
                }
                outputFileName = "${targetFileNamePrefix}.apk"
                project.logger.error("outputFileName: ${targetFileNamePrefix}")
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'org.jetbrains.anko:anko-commons:0.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2"
    implementation 'com.github.wuguang1:FrameW:1.1.4'
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    implementation 'com.geyifeng.immersionbar:immersionbar-ktx:3.2.2'
    implementation 'com.github.bumptech.glide:glide:4.13.0'

//    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
//    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'

    implementation 'io.moquette:moquette-broker:0.15'
    implementation 'androidx.lifecycle:lifecycle-service:2.5.1'

    implementation 'org.webrtc:google-webrtc:1.0.+'
    implementation "org.java-websocket:Java-WebSocket:1.4.0"

}